pipeline:
  name: pactfix-quality
  profile: python-minimal

  metrics:
    cc_max: 15
    critical_max: 0

  # pactfix uses npm — override the test stage from profile
  stages:
    - name: analyze
      tool: code2llm-filtered
      optional: true
      timeout: 0

    - name: validate
      tool: vallm-filtered
      optional: true
      timeout: 0

    - name: prefact
      tool: prefact
      optional: true
      timeout: 900

    - name: fix
      tool: llx-fix
      optional: true
      timeout: 1800

    - name: test
      run: npm test
      when: always

  env:
    LLM_MODEL: openrouter/qwen/qwen3-coder-next
